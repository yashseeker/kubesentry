spring.application.name=kubesentry

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kubesentry}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1957}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
management.endpoints.web.exposure.include=*
jwt.secret=your-super-secret-key-that-is-at-least-32-characters-long
jwt.expiration=86400000

logging.level.org.springframework.security=TRACE

management.info.env.enabled=true
info.app.name=KubeSentry
info.app.version=1.0
info.app.description=Cloud Native Kubernetes Monitoring Platform

management.endpoint.prometheus.enabled=true
